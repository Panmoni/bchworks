metadata:
  title: 'Ganar Bitcoin Cash BCH: trabajar, desarrollar, dar propinas y recibir pagos'
  description: 'Formas de ganar Bitcoin Cash: trabajar como freelance, crear, dar propinas, cobrar recompensas por tareas, financiar proyectos colectivamente con Flipstarter, mantener infraestructura o cobrar por uso con micropagos.'
hero:
  title: Ganar Bitcoin Cash
  subtitle: Recibe pagos en un dinero que cuesta una décima de centavo mover. Incluso vale la pena enviar cantidades pequeñas.
how:
  title: Cómo ganar BCH
  subtitle: "Las microcomisiones cambian lo que vale la pena cobrar. Una propina de 0,05\_US$, un pago por artículo o un precio por llamada a una API tienen sentido cuando mover el dinero cuesta unos 0,001\_US$."
  highlight: Ganar algo de BCH
  items:
    - title: Freelance y ventas
      description: Factura a clientes de cualquier lugar en BCH. Sin comisión de plataforma, sin demoras en los pagos, sin contracargos.
      url: /accept
    - title: Desarrollo y recompensas
      description: Lanza billeteras, herramientas y contratos. Las recompensas de la comunidad y las campañas de financiación colectiva de Flipstarter pagan a los desarrolladores en BCH.
      url: /build
    - title: Cobro por uso
      description: Vende llamadas a APIs, descargas o tareas de agentes de IA por centavos. Las comisiones de BCH son lo bastante bajas para que el cobro por uso funcione.
      url: /build
    - title: Infraestructura
      description: Mina bloques o mantén los nodos e indexadores de los que dependen las aplicaciones. La minería requiere un capital considerable; haz las cuentas primero.
      url: /mining
