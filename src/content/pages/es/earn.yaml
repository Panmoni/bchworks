  subtitle: Protocolos DeFi
gaming:
  subtitle: Juegos
video:
  title: Reproductor de video de YouTube
why:
  title: Por qué ganar en BCH
  subtitle: Las ventajas y las desventajas.
  items:
    - title: Quédate con lo que ganas
      icon: tabler:cash
      description: "Unos 0,001\_US$ por pago, fijo. Una propina de 2\_US$ llega como 2\_US$, no como 1,40\_US$ después de las comisiones de la plataforma y de la tarjeta."
    - title: Pagos desde cualquier lugar
      icon: tabler:world
      description: Un cliente en el extranjero te paga igual que un vecino. Sin transferencias bancarias, sin montos mínimos de retiro, sin días de espera.
    - title: Hecho para pagos pequeños
      icon: tabler:robot
      description: Las máquinas pueden pagar a otras máquinas. Las APIs de pago por llamada y los agentes de IA que pagan por lo que usan son viables con estas comisiones.
    - title: Ninguna cuenta que congelar
      icon: tabler:key
      description: Tus ganancias llegan a una billetera que tú controlas. Ninguna plataforma puede retener tu saldo ni cerrar tu cuenta.
    - title: Financiación colectiva con Flipstarter
      icon: tabler:heart-handshake
      description: Los aportes solo se cobran si se alcanza la meta, y eso se garantiza en la cadena. Los desarrolladores de BCH han financiado años de trabajo de esta forma.
    - title: Ojo con el precio
      icon: tabler:chart-line
      description: BCH es volátil. Si necesitas ingresos estables, convierte parte de cada pago o guarda una stablecoin de BCH, como ParyonUSD.
cta:
  title: Recibe novedades de BCH
  subtitle: Actualizaciones, herramientas y noticias del ecosistema, sin exageraciones.
  action: Recibir novedades de BCH
