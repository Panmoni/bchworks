metadata:
  title: ¿Qué es un UTXO? Mira cómo se gastan monedas reales
  description: 'Un UTXO es una salida de transacción no gastada: una moneda. Dale a la Máquina UTXO una transacción real de Bitcoin Cash, mira cómo se consumen y se acuñan monedas y sigue cualquier moneda hasta el bloque que la creó.'
hero:
  chip: La Máquina UTXO
  title: ¿Qué es un UTXO? Mira cómo se gastan monedas reales.
  subtitle: Un UTXO (salida de transacción no gastada) es una moneda. Cada transacción de Bitcoin Cash funde algunas monedas y acuña otras nuevas. Pega cualquier transacción abajo y mira cómo ocurre; luego sigue una moneda hasta el bloque que la creó.
