metadata:
  title: Directorio del ecosistema Bitcoin Cash, con revisión diaria de estado
  description: Todas las billeteras, exchanges, herramientas para comercios, dapps y bibliotecas para desarrolladores de Bitcoin Cash que conocemos. Cada enlace se revisa a diario, para que veas qué proyectos están activos, estancados o muertos.
datasetName: Directorio del ecosistema Bitcoin Cash con revisiones de estado
hero:
  title: El directorio de BCH que sabe qué está muerto
  subtitle: proyectos. Cada enlace se comprueba a diario y en cada repositorio se buscan commits recientes.
states:
  alive: activo
  stale: estancado
  dead: muerto
  unknown: desconocido
legend:
  html: '<strong>Activo</strong>: el sitio responde y el código tuvo cambios en el último año. <strong>Estancado</strong>: el sitio responde, pero el repositorio está archivado o lleva un año inactivo. <strong>Muerto</strong>: falló dos revisiones seguidas. <strong>Desconocido</strong>: el sitio bloquea bots o aún no tenemos datos.'
  lastCheck: Última revisión
  noCheck: La primera revisión automática aún no se ha ejecutado.
  missing: ¿Conoces un proyecto que nos falta o uno con datos incorrectos?
  edit: Editar la lista en GitHub
search:
  label: Buscar en el directorio
  placeholder: Buscar proyectos…
  showAll: mostrar todo
sectionsNav: Secciones del directorio
sections:
  wallet: Billeteras
  buy: Comprar e intercambiar
  spend: Gastar
  earn: Ganar
  accept: Aceptar pagos
  cashtokens: CashTokens
  build: Desarrollar
  mining: Minería
  support: Comunidad y medios
  governance: Gobernanza
commit: commit
graveyard:
  title: Cementerio
  text: Proyectos que cerraron o abandonaron BCH. Los conservamos para que los enlaces antiguos tengan sentido. No les envíes dinero.
