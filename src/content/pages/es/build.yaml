metadata:
  title: 'Cómo desarrollar en Bitcoin Cash (BCH): covenants y CashTokens'
  description: Bitcoin Cash es el lugar más barato para aprender y lanzar contratos al estilo de Bitcoin. Los bucles, las funciones, BigInt y los tokens nativos ya funcionan en la red principal, y una transacción de prueba cuesta unos 0,001 US$.
hero:
  title: El laboratorio de covenants de Bitcoin, en funcionamiento en la red principal.
  subtitle: Las ideas de contratos que Bitcoin todavía debate ya funcionan en Bitcoin Cash. Apréndelas aquí, donde una transacción de prueba cuesta unos 0,001 US$.
start:
  title: Empezar a desarrollar
  subtitle: CashScript para contratos, Libauth y Bitauth IDE para recorrer la VM paso a paso, mainnet-js para billeteras y tokens. Todo de código abierto.
