faq:
  title: Preguntas
  items:
    - q: ¿Cuál es la mejor billetera de Bitcoin Cash?
      a: Para pagos cotidianos y CashTokens, elige una billetera sin custodia con soporte completo de CashTokens, como Paytaca o Cashonize. Para uso avanzado en computadora, Electron Cash. Para ahorros grandes, una billetera física. La tabla muestra qué billetera se ajusta a cada necesidad.
    - q: ¿Qué billeteras de Bitcoin Cash admiten CashTokens y NFTs?
      a: Las billeteras marcadas como “completo” en la columna CashTokens pueden guardar, enviar y mostrar tokens fungibles y NFTs. “Parcial” significa que guardan tokens, pero les faltan algunas funciones, como mostrar NFTs o acuñarlos.
    - q: ¿Qué significa “sin custodia”?
      a: Tú guardas las claves, normalmente como una frase semilla de 12 o 24 palabras. Nadie puede congelar ni perder tus monedas por ti. También significa que nadie puede recuperarlas si pierdes la frase semilla.
    - q: ¿Qué es WalletConnect en Bitcoin Cash?
      a: Una forma estándar de conectar tu billetera a una aplicación web (un DEX, un mercado de NFTs, un juego) y aprobar transacciones desde tu celular. Las apps de BCH usan las especificaciones BCH de WalletConnect y CashConnect.
