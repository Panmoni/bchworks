  note: “Última versión” proviene de las versiones públicas de la billetera en GitHub; las billeteras de código cerrado muestran n/d. Las funciones se revisan a mano con el sitio y la ficha en la tienda de apps de cada billetera; cada fila indica cuándo. ¿Ves un error? <a class="underline" href="https://github.com/Panmoni/bitcoincashsite-www/blob/main/src/data/projects.json" target="_blank" rel="noopener noreferrer">Corrígelo en GitHub</a>. Más proyectos en el <a class="underline" href="/directory">directorio</a>.
platforms:
  - id: android
    title: Billeteras de Bitcoin Cash para Android
    text: 'Cada billetera de abajo tiene app para Android. Instálala desde Google Play o, si la billetera lo ofrece, descarga el APK de su sitio oficial o de su página de versiones en GitHub. Nunca instales el APK de una billetera desde un espejo o un enlace que alguien te envió: los APKs falsos roban frases semilla.'
  - id: ios
    title: Billeteras de Bitcoin Cash para iOS (iPhone y iPad)
    text: 'Cada billetera de abajo tiene app para iPhone en la App Store. Revisa el nombre del desarrollador en la ficha antes de instalar: las apps de billetera falsas copian nombres e íconos reales.'
  - id: desktop
    title: Billeteras de escritorio de Bitcoin Cash para Windows, macOS y Linux
    text: Estas billeteras funcionan en una computadora. La mayoría ofrece versiones para Windows, macOS y Linux; revisa la página de descarga de la billetera para tu sistema. Electron Cash es la veterana billetera de escritorio de BCH con todas las funciones.
  - id: hardware
    title: Billeteras físicas de Bitcoin Cash
    text: Una billetera física guarda tus claves en un dispositivo aparte y firma ahí cada transacción, así que el malware de tu computadora o celular no puede gastar tus monedas. Cómprala al fabricante, nunca de segunda mano, y comprueba que su firmware actual sea compatible con BCH.
builders: ¿Desarrollas en Bitcoin Cash? Empieza en el <a class="underline" href="/build">centro para desarrolladores</a> y luego acuña tus primeros NFTs con el <a class="underline" href="/blog/token-pioneers-cashtokens-tutorial-2">tutorial 2 de Token Pioneers</a>.
faq:
  title: Preguntas
  items:
    - q: ¿Cuál es la mejor billetera de Bitcoin Cash?
      a: Para pagos diarios y CashTokens, elige una billetera sin custodia con compatibilidad completa con CashTokens, como Paytaca o Cashonize. Para uso avanzado en escritorio, Electron Cash. Para ahorros grandes, una billetera física. La tabla muestra qué billetera se ajusta a cada necesidad.
    - q: ¿Qué billeteras de Bitcoin Cash son compatibles con CashTokens y NFTs?
      a: Las billeteras marcadas como “completa” en la columna CashTokens pueden guardar, enviar y mostrar tokens fungibles y NFTs. “Parcial” significa que guardan tokens pero les faltan algunas funciones, como mostrar NFTs o acuñarlos.
    - q: ¿Qué significa sin custodia?
      a: Tú guardas las claves, normalmente como una frase semilla de 12 o 24 palabras. Nadie puede congelar ni perder tus monedas por ti. También significa que nadie puede recuperarlas si pierdes la frase semilla.
    - q: ¿Qué es WalletConnect en Bitcoin Cash?
      a: Una forma estándar de conectar tu billetera a una app web (un DEX, un mercado de NFTs, un juego) y aprobar transacciones desde tu celular. Las apps de BCH usan las especificaciones WalletConnect y CashConnect de BCH.
    - q: ¿Qué billetera de Bitcoin Cash funciona en Android, iPhone y escritorio?
      a: Varias billeteras tienen apps para las tres plataformas, como Electron Cash, Stack Wallet, Cake Wallet y Exodus. La columna Plataformas de la tabla muestra las apps de cada billetera.
    - q: ¿Es seguro descargar el APK de una billetera de Bitcoin Cash?
      a: Solo desde el sitio oficial de la billetera o su página de versiones en GitHub. Los APKs falsos de billeteras son una forma común de robar frases semilla. Si la billetera está en Google Play, instalarla desde ahí es la opción más sencilla.
