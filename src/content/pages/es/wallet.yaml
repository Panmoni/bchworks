metadata:
  title: Las mejores billeteras de Bitcoin Cash para Android, iOS y escritorio, y billeteras físicas
  description: 'Compara todas las billeteras de Bitcoin Cash (BCH) para Android, iPhone, Windows, macOS y Linux, y las billeteras físicas: compatibilidad con CashTokens y NFTs, custodia, WalletConnect, código abierto y fecha de la última versión. Revisadas a diario.'
updateDate: 2026-11-21
updated: Actualizado
hero:
  title: Elige una billetera de Bitcoin Cash
  subtitle: '{count} billeteras, una sola tabla. El estado y las fechas de versión se actualizan a diario.'
tips:
  - label: ¿Recién llegas a BCH?
    text: Elige una billetera de celular <strong>sin custodia</strong> con compatibilidad <strong>completa</strong> con CashTokens. Escribe la frase semilla en papel.
  - label: ¿Usas dapps?
    text: Necesitas <strong>WalletConnect</strong> para firmar en DEXs, mercados de NFTs y juegos.
  - label: ¿Guardas una cantidad grande?
    text: 'Usa una billetera <strong>física</strong> (hardware wallet) y revisa la fecha de la última versión: un firmware desactualizado es un riesgo.'
