metadata:
  title: 'Las mejores billeteras de Bitcoin Cash: matriz de funciones'
  description: 'Compara todas las billeteras de Bitcoin Cash lado a lado: compatibilidad con CashTokens y NFTs, custodia, plataformas, WalletConnect, código abierto y fecha de la última versión. Revisado a diario.'
updateDate: 2026-11-21
updated: Actualizado
hero:
  title: Elige una billetera de Bitcoin Cash
  subtitle: '{count} billeteras en una sola tabla. El estado y las fechas de las versiones se actualizan a diario.'
tips:
  - label: ¿Eres nuevo en BCH?
    text: Elige una billetera para celular <strong>sin custodia</strong> con compatibilidad <strong>completa</strong> con CashTokens. Anota la frase semilla en papel.
  - label: ¿Usas dapps?
    text: Necesitas <strong>WalletConnect</strong> para firmar en DEXs, mercados de NFTs y juegos.
  - label: ¿Guardas una cantidad grande?
    text: 'Usa una billetera <strong>física</strong> (hardware wallet) y revisa la fecha de la última versión: un firmware antiguo es un riesgo.'
