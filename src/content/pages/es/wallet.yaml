metadata:
  title: 'Las mejores billeteras de Bitcoin Cash: matriz de funciones'
  description: 'Compara todas las billeteras de Bitcoin Cash lado a lado: soporte de CashTokens y NFTs, custodia, plataformas, WalletConnect, código abierto y fecha del último lanzamiento. Se verifica a diario.'
hero:
  title: Elige una billetera de Bitcoin Cash
  subtitle: Billeteras de {count} en una sola tabla. El estado y las fechas de lanzamiento se actualizan a diario.
tips:
  - label: ¿Recién llegas a BCH?
    text: Elige una billetera para celular <strong>sin custodia</strong> con soporte <strong>completo</strong> de CashTokens. Escribe la frase semilla en papel.
  - label: ¿Usas dapps?
    text: Necesitas <strong>WalletConnect</strong> para firmar en DEXs, mercados de NFTs y juegos.
  - label: ¿Guardas mucho?
    text: 'Usa una billetera <strong>física</strong> y revisa la fecha del último lanzamiento: un firmware antiguo es un riesgo.'
