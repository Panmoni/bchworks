platforms:
  - id: android
    title: Billeteras de Bitcoin Cash para Android
    text: 'Cada billetera de esta lista tiene app para Android. Instálala desde Google Play o, si la billetera lo ofrece, el APK de su sitio oficial o de su página de versiones en GitHub. Nunca instales el APK de una billetera desde un espejo o un enlace que alguien te envió: los APK falsos roban frases semilla.'
  - id: ios
    title: Billeteras de Bitcoin Cash para iOS (iPhone y iPad)
    text: 'Cada billetera de esta lista tiene app para iPhone en la App Store. Revisa el nombre del desarrollador en la ficha antes de instalarla: las apps de billeteras falsas copian nombres e íconos reales.'
  - id: desktop
    title: Billeteras de escritorio de Bitcoin Cash para Windows, macOS y Linux
    text: 'Estas billeteras funcionan en una computadora. La mayoría ofrece versiones para Windows, macOS y Linux; revisa la página de descarga de la billetera para tu sistema. Electron Cash es la billetera de escritorio de BCH más veterana y completa.'
  - id: hardware
    title: Billeteras físicas (hardware wallets) de Bitcoin Cash
    text: 'Una billetera física guarda tus claves en un dispositivo aparte y firma cada transacción allí, así que un malware en tu computadora o celular no puede gastar tus monedas. Cómprala al fabricante, nunca de segunda mano, y revisa que su firmware actual admita BCH.'
builders: '¿Desarrollas sobre Bitcoin Cash? Empieza en el <a class="underline" href="/build">centro para desarrolladores</a> y luego acuña tus primeros NFTs con el <a class="underline" href="/blog/token-pioneers-cashtokens-tutorial-2">tutorial 2 de Token Pioneers</a>.'
faq:
  title: Preguntas
  items:
    - q: ¿Cuál es la mejor billetera de Bitcoin Cash?
      a: Para pagos cotidianos y CashTokens, elige una billetera sin custodia con compatibilidad completa con CashTokens, como Paytaca o Cashonize. Para uso avanzado en escritorio, Electron Cash. Para ahorros grandes, una billetera física. La tabla muestra qué billetera se ajusta a cada necesidad.
    - q: ¿Qué billeteras de Bitcoin Cash admiten CashTokens y NFTs?
      a: Las billeteras marcadas como “completo” en la columna CashTokens pueden guardar, enviar y mostrar tokens fungibles y NFTs. “Parcial” significa que guardan tokens pero les faltan algunas funciones, como mostrar NFTs o acuñarlos.
    - q: ¿Qué significa “sin custodia”?
      a: Tú tienes las claves, normalmente como una frase semilla de 12 o 24 palabras. Nadie puede congelar ni perder tus monedas por ti. También significa que nadie puede recuperarlas si pierdes la frase semilla.
    - q: ¿Qué es WalletConnect en Bitcoin Cash?
      a: Una forma estándar de conectar tu billetera a una aplicación web (un DEX, un mercado de NFTs, un juego) y aprobar transacciones desde tu celular. Las aplicaciones de BCH usan las especificaciones BCH WalletConnect y CashConnect.
    - q: ¿Qué billetera de Bitcoin Cash funciona en Android, iPhone y escritorio?
      a: Varias billeteras tienen apps para los tres, como Electron Cash, Stack Wallet, Cake Wallet y Exodus. La columna Plataformas de la tabla muestra las apps de cada billetera.
    - q: ¿Es seguro descargar el APK de una billetera de Bitcoin Cash?
      a: Solo desde el sitio oficial de la billetera o su página de versiones en GitHub. Los APK falsos son una forma común de robar frases semilla. Si la billetera está en Google Play, instalarla desde allí es la opción más sencilla.
