metadata:
  title: 'BCH CashTokens: tokens fungibles y NFTs en Bitcoin Cash'
  description: Los CashTokens son tokens fungibles y NFTs integrados en el propio Bitcoin Cash. Sin contrato de token, sin approve() con el que te puedan vaciar y menos de un centavo por acuñar o enviar.
