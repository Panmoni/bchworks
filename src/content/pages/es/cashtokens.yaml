metadata:
  title: 'BCH CashTokens: tokens fungibles y NFTs en Bitcoin Cash'
  description: CashTokens son tokens fungibles y NFTs integrados en el propio Bitcoin Cash. Sin contrato de token, sin approve() que alguien pueda usar para vaciar tu billetera y menos de un centavo por acuñar o enviar.
