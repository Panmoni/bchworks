native:
  title: Tokens sin el lastre de la EVM
  subtitle: En la mayoría de las cadenas, un token es un contrato inteligente que lleva un registro de saldos. En Bitcoin Cash, el token forma parte de la moneda que tienes.
  items:
    - title: Nativos, no un contrato
      icon: tabler:coins
      description: Desde mayo de 2023, cada salida de BCH puede llevar tokens fungibles o un NFT. Los mineros validan las reglas de los tokens. Nadie despliega ni es dueño de un contrato de token.
    - title: Sin approve() que puedan usar para vaciarte
      icon: tabler:shield-check
      description: Las aprobaciones de tokens antiguas son una de las principales causas de pérdidas en las cadenas EVM. CashTokens no tienen un sistema de permisos de gasto. Solo una firma de tus claves mueve tus tokens.
    - title: Menos de un centavo por acuñar o enviar
      icon: tabler:receipt
      description: Pagas franqueo por byte, no gas por cómputo. Una acuñación o una transferencia cuesta mucho menos de un centavo, así que las pruebas y las distribuciones pequeñas siguen siendo baratas.
    - title: La misma prueba de trabajo que BCH
      icon: tabler:lock
      description: Los tokens se mueven en transacciones normales de BCH. Tienen la misma seguridad de prueba de trabajo SHA-256 que la propia moneda, sin puentes ni cadenas laterales.
    - title: NFTs que guardan estado
      icon: tabler:database
      description: Un NFT lleva un compromiso que los contratos pueden leer. Desde la actualización de mayo de 2026 admite hasta 128 bytes, suficiente para recibos, entradas o el estado de un juego.
    - title: Metadatos que puedes verificar
      icon: tabler:id-badge
      description: Los registros de BCMR asocian nombres, símbolos e íconos a una categoría de token. Las billeteras comparan el registro con un hash que el emisor publicó en la cadena.
honest:
  title: La parte honesta
  subtitle: De qué no te protegen CashTokens.
  items:
    - title: Los emisores aún pueden vender en masa
      icon: tabler:alert-triangle
      description: Los tokens nativos eliminan los exploits de aprobaciones. No impiden que un equipo venda su propia oferta. Revisa la distribución de tenedores en TokenStork antes de comprar.
    - title: La liquidez es escasa
      icon: tabler:chart-line
      description: Existen unas 20.000 categorías de token, pero solo unos pocos cientos se negocian en Cauldron, Fex o TapSwap. Muchos tokens no tienen ningún mercado.
    - title: Los contratos pueden tener errores
      icon: tabler:bug
      description: Los tokens usados dentro de covenants heredan el riesgo de ese covenant. No hay claves de administrador, pero un contrato defectuoso sigue siendo defectuoso. Lee las auditorías cuando existan.
