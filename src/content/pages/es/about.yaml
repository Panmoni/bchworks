metadata:
  title: Acerca de BCH Works
  description: 'BCH Works hace que Bitcoin Cash se entienda y cobre vida: guías y herramientas honestas, basadas en datos, para usar BCH y desarrollar sobre él. Financiado colectivamente con 277,08 BCH en 2020. Un proyecto de Panmoni.'
header:
  chip: Acerca de
  title: No es un discurso de venta. Es un <mark class="bg-wb-green text-on-accent px-[0.12em] rounded-[0.12em] [box-decoration-break:clone]">taller</mark>.
  intro: En 2020, la comunidad de Bitcoin Cash financió este sitio en cinco horas. Seguimos mostrando nuestro trabajo. BCH Works explica cómo funciona Bitcoin Cash, en qué es bueno y dónde se queda corto. Luego te ayuda a probarlo tú mismo.
