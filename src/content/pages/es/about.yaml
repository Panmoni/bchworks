principles:
  chip: Reglas de consenso
  title: Cuatro reglas que no bifurcamos.
  intro: Todas las páginas de este sitio las siguen. Así se ve cada una en una frase. Avísanos cuando una página rompa alguna.
  'yes': Escribimos
  'no': No escribimos
  rules:
    - code: regla_01 datos_primero
      title: Mostrar la cifra.
      body: Comisiones, tamaños de bloque y fechas de actualización. Te mostramos la cifra, no un adjetivo.
      'yes': Una transacción de prueba cuesta unos 0,001 US$.
      'no': ¡Comisiones casi cero, a la velocidad del rayo!
      tone: bg-wb-green
    - code: regla_02 límites
      title: Decir los puntos débiles.
      body: BCH tiene un ecosistema pequeño, poca liquidez, bloques de 10 minutos y no tiene privacidad por defecto. Lo decimos, junto a lo bueno.
      'yes': Los pagos aparecen en segundos. La liquidación final tarda unos 10 minutos.
      'no': Pagos instantáneos y definitivos.
      tone: bg-wb-yellow
    - code: regla_03 práctica
      title: Que puedas probarlo.
      body: Te indicamos cosas que puedes probar tú mismo, no cosas que debas aceptar por fe.
      'yes': Envíate unos centavos y mira cómo llegan.
      'no': Confía en nosotros, funciona.
      tone: bg-wb-blue
    - code: regla_04 sin_precio
      title: Sin hablar de precios.
      body: No predecimos precios ni prometemos rendimientos. Este sitio trata de lo que hace BCH.
      'yes': BCH es volátil. Guarda solo lo que puedas permitirte perder.
      'no': BCH a 10.000 US$ para el próximo halving.
      tone: bg-wb-pink
limits:
  chip: La regla 2, completa
  title: En qué se queda corto BCH.
  introBefore: Los puntos débiles, en un solo lugar.
  introLink: Por qué Bitcoin Cash
  introAfter: cubre los fuertes.
  columns:
    limit: Límite
    fact: En resumen
    meaning: Qué significa para ti
  rows:
    - limit: Liquidación
      fact: ~10 min por bloque
      meaning: Los pagos aparecen en segundos. En una venta grande, espera un bloque antes de entregar la mercancía.
    - limit: Liquidez
      fact: escasa
      meaning: Menos exchanges y libros de órdenes que BTC o las stablecoins (monedas estables). Las operaciones grandes mueven el precio, así que revisa primero el spread.
    - limit: Privacidad
      fact: pública por defecto
      meaning: Cualquiera puede leer el historial de una dirección. Usa una dirección nueva para cada pago que recibas.
    - limit: Ecosistema
      fact: pequeño
      meaning: Menos billeteras, comercios y desarrolladores que las cadenas más grandes. Pregunta en la tienda antes de pagar con él.
history:
  chip: Historia
  title: Un bloque a la vez.
  blocks:
    - label: bloque 0 · génesis
      date: ago 2020
      body: 'George Donnelly lanza BitcoinCash.site. Objetivo: un millón de nuevos usuarios de Bitcoin Cash.'
    - label: bloque 1
      date: sep 2020
      body: Un Flipstarter recauda 277,08 BCH en cinco horas, el más rápido hasta entonces.
      link:
        text: Campaña archivada
        href: https://archive.ph/50X6L
    - label: bloque 2
      date: 2020–22
      body: El equipo de Panmoni incorpora a más de 1000 comercios y más de 2500 usuarios en toda Venezuela, con un presupuesto mínimo.
      link:
        text: Libro de fotos
        href: /blog/bitcoin-agents-venezuela-photo-book
    - label: bloque 3
      date: '2023'
      body: Se lanzan los CashTokens. Token Pioneers enseña a la gente a acuñar sus propios tokens.
      link:
        text: 'Tutorial #1'
        href: /blog/token-pioneers-cashtokens-tutorial-1
    - label: bloque 4
      date: '2024'
      body: 'Se lanza TokenStork: un directorio y explorador de todos los CashTokens.'
      link:
        text: Acerca de TokenStork
        href: /blog/tokenstork
    - label: bloque 5
      date: '2026'
      body: Pasa a llamarse BCH Works, con un diseño nuevo y una reescritura honesta.
    - label: mempool · sin confirmar
      date: Lo próximo
      body: Vistas en vivo de la cadena desde nuestro propio nodo completo y plantillas de covenants (contratos que limitan cómo se pueden gastar las monedas) que puedes probar en la red principal.
      pending: true
