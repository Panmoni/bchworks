metadata:
  title: "Best Bitcoin Cash Wallets for Android, iOS, Desktop and Hardware"
  description: "Compare every Bitcoin Cash (BCH) wallet for Android, iPhone, Windows, macOS, Linux and hardware: CashTokens and NFT support, custody, WalletConnect, open source and last release date. Checked daily."

# Shown as "Updated <date>" under the title. Bump it when the copy or the
# wallet list changes.
updateDate: 2026-11-21
updated: Updated

hero:
  title: Choose a Bitcoin Cash wallet
  subtitle: "{count} wallets, one table. Health and release dates refresh daily."

tips:
  - label: New to BCH?
    text: Pick a <strong>non-custodial</strong> phone wallet with <strong>full</strong> CashTokens support. Write the seed phrase on paper.
  - label: Using dapps?
    text: You need <strong>WalletConnect</strong> to sign on DEXs, NFT markets and games.
  - label: Holding a lot?
    text: "Use a <strong>hardware</strong> wallet, and check the last release date: old firmware is a risk."

